<svg xmlns='http://www.w3.org/2000/svg' width='120' height='24' viewBox='0 0 120 24'>
  <defs>
    <linearGradient id='goldGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#E6C265'/>
      <stop offset='50%' stop-color='#B8860B'/>
      <stop offset='100%' stop-color='#8C6239'/>
    </linearGradient>
  </defs>
  <!-- Base lines -->
  <line x1='0' y1='2' x2='120' y2='2' stroke='url(#goldGrad)' stroke-width='1.5'/>
  <line x1='0' y1='22' x2='120' y2='22' stroke='url(#goldGrad)' stroke-width='1.5'/>
  <line x1='0' y1='4.5' x2='120' y2='4.5' stroke='#D4AF37' stroke-width='0.7' stroke-opacity='0.6'/>
  <line x1='0' y1='19.5' x2='120' y2='19.5' stroke='#D4AF37' stroke-width='0.7' stroke-opacity='0.6'/>
  <!-- Triangle 1 (x=0..30) -->
  <polygon points='15,5 28,19 2,19' fill='#FFFDF7' stroke='url(#goldGrad)' stroke-width='1.2'/>
  <polygon points='15,8 24,18 6,18' fill='#FBF2DF' stroke='#B8860B' stroke-width='0.8'/>
  <circle cx='15' cy='14' r='2' fill='#8C6239'/>
  <circle cx='15' cy='6' r='1.2' fill='#D4AF37'/>
  <!-- Triangle 2 (x=30..60) -->
  <polygon points='45,5 58,19 32,19' fill='#FFFDF7' stroke='url(#goldGrad)' stroke-width='1.2'/>
  <polygon points='45,8 54,18 36,18' fill='#FBF2DF' stroke='#B8860B' stroke-width='0.8'/>
  <circle cx='45' cy='14' r='2' fill='#8C6239'/>
  <circle cx='45' cy='6' r='1.2' fill='#D4AF37'/>
  <!-- Triangle 3 (x=60..90) -->
  <polygon points='75,5 88,19 62,19' fill='#FFFDF7' stroke='url(#goldGrad)' stroke-width='1.2'/>
  <polygon points='75,8 84,18 66,18' fill='#FBF2DF' stroke='#B8860B' stroke-width='0.8'/>
  <circle cx='75' cy='14' r='2' fill='#8C6239'/>
  <circle cx='75' cy='6' r='1.2' fill='#D4AF37'/>
  <!-- Triangle 4 (x=90..120) -->
  <polygon points='105,5 118,19 92,19' fill='#FFFDF7' stroke='url(#goldGrad)' stroke-width='1.2'/>
  <polygon points='105,8 114,18 96,18' fill='#FBF2DF' stroke='#B8860B' stroke-width='0.8'/>
  <circle cx='105' cy='14' r='2' fill='#8C6239'/>
  <circle cx='105' cy='6' r='1.2' fill='#D4AF37'/>
  <!-- Inverted small diamonds in between -->
  <polygon points='30,4 33,10 30,16 27,10' fill='#D4AF37' fill-opacity='0.8'/>
  <polygon points='60,4 63,10 60,16 57,10' fill='#D4AF37' fill-opacity='0.8'/>
  <polygon points='90,4 93,10 90,16 87,10' fill='#D4AF37' fill-opacity='0.8'/>
  <polygon points='0,4 3,10 0,16' fill='#D4AF37' fill-opacity='0.8'/>
  <polygon points='120,4 120,16 117,10' fill='#D4AF37' fill-opacity='0.8'/>
</svg>
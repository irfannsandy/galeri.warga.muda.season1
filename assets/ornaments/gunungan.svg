  <path d='M 120,195 C 155,160 185,175 195,135 C 170,135 145,155 120,175' fill='none' stroke='url(#goldG)' stroke-width='1.8'/>
  
  <path d='M 120,155 C 80,120 70,110 65,85 C 85,95 105,120 120,135' fill='none' stroke='url(#goldG)' stroke-width='1.5'/>
  <path d='M 120,155 C 160,120 170,110 175,85 C 155,95 135,120 120,135' fill='none' stroke='url(#goldG)' stroke-width='1.5'/>

  <path d='M 120,115 C 95,85 90,65 95,45 C 105,60 115,75 120,95' fill='none' stroke='url(#goldG)' stroke-width='1.2'/>
  <path d='M 120,115 C 145,85 150,65 145,45 C 135,60 125,75 120,95' fill='none' stroke='url(#goldG)' stroke-width='1.2'/>

  <!-- Foliage spirals / curls -->
  <circle cx='55' cy='185' r='5' fill='none' stroke='url(#goldG)' stroke-width='1.2'/>

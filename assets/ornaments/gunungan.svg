      <stop offset='0%' stop-color='#FCE08A'/>
      <stop offset='50%' stop-color='#D4AF37'/>
      <stop offset='100%' stop-color='#8C6239'/>
    </linearGradient>
  </defs>
  <!-- Outer leaf-flame shape of Gunungan -->
